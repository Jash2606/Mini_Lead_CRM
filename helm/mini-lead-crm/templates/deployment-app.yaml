apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: mini-lead-crm
      component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # never remove an old pod before the new one is ready
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mini-lead-crm
        component: app
    spec:
      securityContext:
        runAsNonRoot: true
        # 1000 is the "node" user inside the image
        runAsUser: 1000
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-app-config
            - secretRef:
                name: {{ .Release.Name }}-db-credentials
          # ready = can get traffic, checks the database
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # alive = process is running, does not check the database
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
