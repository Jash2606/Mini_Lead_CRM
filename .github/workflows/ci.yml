name: CI

on:
  push:
    branches: [main, deployment]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # a real postgres database for the tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lead_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: lead_crm
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      # fail if a critical vulnerability is found in the packages we ship
      - run: npm audit --omit=dev --audit-level=critical
      - run: helm lint ./helm/mini-lead-crm --set db.password=test

  build-and-push:
    needs: test
    # only build the image on push, not on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push the image
        run: |
          # image names must be lowercase
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # the commit id as tag shows which commit built the image
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
